services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin_password}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-queue-data:/data

  backend:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: backend
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  websocket:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: websocket
    depends_on:
      backend:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  queue-default:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker default
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  queue-short:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker short
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  queue-long:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker long
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  scheduler:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: scheduler
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - websocket
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sites-data:/var/www/html:ro

volumes:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  sites-data:
