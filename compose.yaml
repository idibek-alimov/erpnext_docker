services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin_password}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-queue-data:/data

  backend:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
      WEB_SYNC_URL: ${WEB_SYNC_URL:-}
      WEB_SYNC_SECRET: ${WEB_SYNC_SECRET:-}
      WEB_SYNC_ENABLED: ${WEB_SYNC_ENABLED:-0}
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
    networks:
      - default
      - frapper-net

  websocket:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: websocket
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  queue-default:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker default
    environment:
      DB_HOST: db
      REDIS_QUEUE: redis-queue:6379
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
      WEB_SYNC_URL: ${WEB_SYNC_URL:-}
      WEB_SYNC_SECRET: ${WEB_SYNC_SECRET:-}
      WEB_SYNC_ENABLED: ${WEB_SYNC_ENABLED:-0}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  queue-short:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker short
    environment:
      DB_HOST: db
      REDIS_QUEUE: redis-queue:6379
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
      WEB_SYNC_URL: ${WEB_SYNC_URL:-}
      WEB_SYNC_SECRET: ${WEB_SYNC_SECRET:-}
      WEB_SYNC_ENABLED: ${WEB_SYNC_ENABLED:-0}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
    networks:
      - default
      - frapper-net

  queue-long:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: worker long
    environment:
      DB_HOST: db
      REDIS_QUEUE: redis-queue:6379
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
      WEB_SYNC_URL: ${WEB_SYNC_URL:-}
      WEB_SYNC_SECRET: ${WEB_SYNC_SECRET:-}
      WEB_SYNC_ENABLED: ${WEB_SYNC_ENABLED:-0}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  scheduler:
    image: ${DOCKER_IMAGE:-idibek/frappe-custom:v15}
    restart: unless-stopped
    command: scheduler
    environment:
      DB_HOST: db
      REDIS_QUEUE: redis-queue:6379
      SITE_NAME: ${SITE_NAME:-radolfa.localhost}
      WEB_SYNC_URL: ${WEB_SYNC_URL:-}
      WEB_SYNC_SECRET: ${WEB_SYNC_SECRET:-}
      WEB_SYNC_ENABLED: ${WEB_SYNC_ENABLED:-0}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites

  frontend:
    image: nginx:alpine
    container_name: frappe_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    environment:
      FRAPPE_SITE_NAME: ${SITE_NAME:-radolfa.localhost}
    depends_on:
      - backend
      - websocket
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - sites-data:/var/www/html:ro
    networks:
      - default

volumes:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  sites-data:

networks:
  default:
  frapper-net:
    name: frapper-net
    external: true
