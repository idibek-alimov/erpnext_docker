server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # FRAPPE_SITE_NAME is substituted by nginx envsubst at container startup.
    # This tells Frappe which site to serve regardless of the Host header.
    set $frappe_site "${FRAPPE_SITE_NAME}";

    # Static compiled assets
    location /assets/ {
        alias /var/www/html/assets/;
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, no-transform";
    }

    # User-uploaded files
    location /files/ {
        alias /var/www/html/;
        try_files $uri =404;
    }

    # WebSocket / Socket.IO
    location /socket.io {
        proxy_pass         http://websocket:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Frappe-Site-Name $frappe_site;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # All other traffic → Frappe backend
    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Frappe-Site-Name $frappe_site;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
